# Linux services for the POC. Native (Metal) components run outside Docker — see docs/architecture.md §6.
#   make up                                    -> postgres (bank + kb databases, pgvector)
#   docker compose --profile telephony up -d   -> + redis (Asterisk / LiveKit SIP are added by T-TEL tasks)
#   make docker-test                           -> unit + integration tests inside a container
# Application services (bank-api, gateway, scheduler, console) are added by their module tasks and
# reuse the `x-app` anchor below.
name: supportagent

x-app: &app
  build: { context: ., dockerfile: docker/app.Dockerfile, target: runtime }
  image: supportagent-app:dev
  env_file: [{ path: .env, required: false }]
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_USER: ${POSTGRES_USER:-supportagent}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
  depends_on:
    postgres: { condition: service_healthy }

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supportagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: postgres
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP (-h 127.0.0.1) on purpose: during first-start init Postgres runs a socket-only temp server,
      # and a socket check would report healthy before infra/postgres/init/ has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  bank-api:
    <<: *app
    # Mock core bank internal API (specs/02-mock-bank). Migrates `bank` on start; seed it with
    # `docker compose exec bank-api python -m supportagent.bank.seed --as-of 2026-11-09 --reset`.
    command: ["sh", "-c", "alembic -n bank upgrade head && exec uvicorn supportagent.bank.api:app --host 0.0.0.0 --port 8001"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-supportagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-change-me-local-only}
      GATEWAY_WORKER_TOKEN: ${GATEWAY_WORKER_TOKEN:-change-me-local-only}
      AUDIT_HASH_SALT: ${AUDIT_HASH_SALT:-change-me-local-only}
      SCHEDULER_TOKEN: ${SCHEDULER_TOKEN:-change-me-local-only}
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    <<: *app
    # Agent data gateway (specs/04-gateway): session API, MCP tools at /mcp. Migrates `kb` on start;
    # ingest the policy corpus with `make kb-ingest` (it reads the same Postgres).
    command: ["sh", "-c", "alembic -n kb upgrade head && exec uvicorn --factory supportagent.gateway.app:create_app --host 0.0.0.0 --port 8002"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-supportagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-change-me-local-only}
      GATEWAY_WORKER_TOKEN: ${GATEWAY_WORKER_TOKEN:-change-me-local-only}
      AUDIT_HASH_SALT: ${AUDIT_HASH_SALT:-change-me-local-only}
      SCHEDULER_TOKEN: ${SCHEDULER_TOKEN:-change-me-local-only}
      BANK_API_URL: http://bank-api:8001
      EMBED_URL: http://host.docker.internal:8082/v1  # native llama.cpp embeddings server on the Mac
    depends_on:
      postgres: { condition: service_healthy }
      bank-api: { condition: service_healthy }
    ports: ["8002:8002"]
    # Docker Desktop doesn't always resolve host.docker.internal on project networks; map it explicitly.
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  console:
    <<: *app
    # Operations console and data explorer (specs/11-console): Streamlit, read-only, HTTP clients only.
    # Bound to localhost on the host (CON-R7). Open http://localhost:8501
    command: ["streamlit", "run", "src/supportagent/console/app.py", "--server.address", "0.0.0.0",
              "--server.port", "8501", "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    environment:
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-change-me-local-only}
      GATEWAY_WORKER_TOKEN: ${GATEWAY_WORKER_TOKEN:-change-me-local-only}
      AUDIT_HASH_SALT: ${AUDIT_HASH_SALT:-change-me-local-only}
      SCHEDULER_TOKEN: ${SCHEDULER_TOKEN:-change-me-local-only}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}  # settings require it; unused here
      BANK_API_URL: http://bank-api:8001
      GATEWAY_URL: http://gateway:8002/mcp
    depends_on:
      bank-api: { condition: service_healthy }
      gateway: { condition: service_healthy }
    ports: ["127.0.0.1:8501:8501"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    profiles: [telephony]
    ports: ["6379:6379"]

  test:
    <<: *app
    build: { context: ., dockerfile: docker/app.Dockerfile, target: test }
    image: supportagent-test:dev
    profiles: [test]
    extra_hosts: ["host.docker.internal:host-gateway"]  # reach the native model servers (eval tests)

volumes:
  pgdata:
