[project]
name = "supportagent"
version = "0.1.0"
description = "AI voice support agent for loan servicing (POC)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "import-linter>=2.1",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supportagent"]

# ------------------------------------------------------------------ tests
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Unmarked tests are unit tests. `make test-int` / `make test-all` override -m.
addopts = "-ra --strict-markers -m 'not integration and not eval and not live'"
markers = [
  "integration: needs Postgres from docker compose (runs in CI)",
  "eval: needs a real local or hosted LLM (manual / nightly)",
  "live: needs model servers and/or telephony running (manual checklist)",
]

[tool.coverage.run]
source = ["supportagent"]
branch = true

# ------------------------------------------------------------------ lint / types
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["specs", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"scripts/tasks.py" = ["UP", "S603", "S607"]  # must stay Python 3.9 compatible; shells out to gh
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["supportagent"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# ------------------------------------------------------------------ module boundaries (specs/README.md)
[tool.importlinter]
root_package = "supportagent"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Agent and voice reach data only through the gateway (constitution II)"
type = "forbidden"
source_modules = ["supportagent.agent", "supportagent.voice"]
forbidden_modules = ["supportagent.bank", "supportagent.kb", "supportagent.gateway", "sqlalchemy", "psycopg"]

[[tool.importlinter.contracts]]
name = "Bank is the system of record and depends on no other module"
type = "forbidden"
source_modules = ["supportagent.bank"]
forbidden_modules = [
  "supportagent.kb", "supportagent.gateway", "supportagent.compliance", "supportagent.agent",
  "supportagent.voice", "supportagent.telephony", "supportagent.scheduler", "supportagent.console",
  "supportagent.evals",
]

[[tool.importlinter.contracts]]
name = "Contracts are pure models"
type = "forbidden"
source_modules = ["supportagent.contracts"]
forbidden_modules = [
  "supportagent.bank", "supportagent.kb", "supportagent.gateway", "supportagent.compliance",
  "supportagent.agent", "supportagent.voice", "supportagent.scheduler", "supportagent.console",
  "supportagent.evals", "supportagent.observability",
]

[[tool.importlinter.contracts]]
name = "Compliance is a pure library"
type = "forbidden"
source_modules = ["supportagent.compliance"]
forbidden_modules = [
  "supportagent.bank", "supportagent.kb", "supportagent.gateway", "supportagent.agent",
  "supportagent.scheduler", "sqlalchemy", "psycopg",
]

[[tool.importlinter.contracts]]
name = "Scheduler and console talk to the bank over HTTP only"
type = "forbidden"
source_modules = ["supportagent.scheduler", "supportagent.console"]
forbidden_modules = ["supportagent.bank", "supportagent.kb", "supportagent.agent", "sqlalchemy", "psycopg"]

[[tool.importlinter.contracts]]
name = "Telephony helpers never touch data"
type = "forbidden"
source_modules = ["supportagent.telephony"]
forbidden_modules = [
  "supportagent.bank", "supportagent.kb", "supportagent.gateway", "supportagent.agent",
  "supportagent.scheduler", "sqlalchemy", "psycopg",
]
