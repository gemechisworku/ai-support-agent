name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  specs:
    name: Specs & traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Validate specs, tasks and PRD traceability
        run: python scripts/tasks.py validate
      - name: PR does not edit the generated STATUS.md
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD -- specs/STATUS.md | grep -q .; then
            echo "::error file=specs/STATUS.md::Don't edit specs/STATUS.md in a PR; it is regenerated on main after merge."
            exit 1
          fi
      - name: One PR per milestone (branch, body and readiness)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.md"
          ready=""; [ "$IS_DRAFT" = "false" ] && ready="--ready"
          python scripts/tasks.py check-pr --body-file "$RUNNER_TEMP/pr_body.md" --branch "$HEAD_REF" $ready

  lint:
    name: Lint, types, boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports

  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: supportagent
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U supportagent -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: supportagent
      POSTGRES_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Local-only placeholder config (job env vars above take precedence)
        run: cp .env.example .env
      - name: Create databases
        env: { PGPASSWORD: ci-only }
        run: psql -h localhost -U supportagent -d postgres -v ON_ERROR_STOP=1 -f infra/postgres/init/01-databases.sql
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: pytest (unit + integration)
        run: uv run pytest -m "not eval and not live" --cov --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage.xml, if-no-files-found: ignore }

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the Next.js console image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/console.Dockerfile
          push: false
          cache-from: type=gha,scope=console
          cache-to: type=gha,mode=max,scope=console

  console:
    name: Console (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - run: npm ci
      - name: Lint and format
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Generated API types match openapi.json
        run: npm run types:check
      - name: Unit tests (Vitest)
        run: npm test
      - name: Production build
        run: npm run build
      - name: No server-only values in the client bundle
        run: npm run check:bundle
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright, fake console API)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: web/console/playwright-report, if-no-files-found: ignore }
