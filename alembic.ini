# One Alembic environment per database; select it with -n:
#   uv run alembic -n bank upgrade head
#   uv run alembic -n kb upgrade head
# The database URL comes from supportagent.common.settings (POSTGRES_* / BANK_DB / KB_DB), not from here.
# Prefix revision ids with the database: `alembic -n bank revision -m "..." --rev-id bank_0002`.

[bank]
script_location = %(here)s/migrations/bank
prepend_sys_path = .
path_separator = os

[kb]
script_location = %(here)s/migrations/kb
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
